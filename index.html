<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 京都・大阪 6天互動地圖（已對調 Day2/Day3）</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f8f9fa; }
        .header { background: #2c3e50; color: white; padding: 16px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        #map { height: 600px; width: 100%; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: white; }
        .filter-btn { padding: 8px 14px; border: 2px solid #ddd; border-radius: 20px; background: white; font-size: 13px; cursor: pointer; }
        .filter-btn.active { background: #e74c3c; color: white; border-color: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗺️ 2026 京都・大阪 6天互動地圖</h1>
        <p style="margin:8px 0 0 0; opacity:0.9;">已對調 Day 2 ↔ Day 3（避開嵐山小火車週三沒開）</p>
    </div>
    
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterDay('all')">全部</button>
        <button class="filter-btn" onclick="filterDay(1)">Day 1</button>
        <button class="filter-btn" onclick="filterDay(2)">Day 2（新）</button>
        <button class="filter-btn" onclick="filterDay(3)">Day 3（新）</button>
        <button class="filter-btn" onclick="filterDay(4)">Day 4</button>
        <button class="filter-btn" onclick="filterDay(5)">Day 5</button>
        <button class="filter-btn" onclick="filterDay(6)">Day 6</button>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([35.0, 135.5], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 只調整 Day 2 和 Day 3，其餘完全不動
        const locations = [
            // Day 1（維持不變）
            {day:1, name:"京都鐵道博物館", lat:34.9888, lng:135.7432, desc:"大型室內鐵道博物館",体力:"🚶 輕鬆"},
            {day:1, name:"teamLab Kyoto", lat:35.0039, lng:135.7715, desc:"沉浸式數位藝術",体力:"🚶 輕鬆"},
            {day:1, name:"伏見稻荷大社", lat:34.9669, lng:135.7731, desc:"千本鳥居",体力:"🚶🚶 中等"},

            // 新 Day 2（原本 Day 3）
            {day:2, name:"天龍寺", lat:35.0098, lng:135.6655, desc:"世界遺產枯山水",体力:"🚶 輕鬆"},

            // 新 Day 3（原本 Day 2）
            {day:3, name:"貴船神社", lat:35.1224, lng:135.7628, desc:"雨中森林浴",体力:"🚶🚶 中等"},
            {day:3, name:"金閣寺", lat:35.0395, lng:135.7294, desc:"世界遺產",体力:"🚶 輕鬆"},

            // Day 4（維持不變）
            {day:4, name:"平等院（宇治）", lat:34.8894, lng:135.8078, desc:"國寶建築",体力:"🚶 輕鬆"},
            {day:4, name:"任天堂博物館", lat:34.8928, lng:135.7842, desc:"全室內互動",体力:"🚶 輕鬆"},

            // Day 5（維持不變）
            {day:5, name:"大阪海遊館", lat:34.6544, lng:135.4293, desc:"世界級水族館",体力:"🚶 輕鬆"},
            {day:5, name:"空庭溫泉", lat:34.6680, lng:135.4950, desc:"室內溫泉",体力:"🚶 輕鬆"},

            // Day 6（維持不變）
            {day:6, name:"臨空城 Outlet", lat:34.4092, lng:135.2990, desc:"購物",体力:"🚶 輕鬆"}
        ];

        let markers = [];

        function createMarkers(filtered) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            filtered.forEach(loc => {
                const marker = L.circleMarker([loc.lat, loc.lng], {
                    radius: 8,
                    fillColor: '#e74c3c',
                    color: 'white',
                    weight: 2
                }).addTo(map);

                const popup = `
                    <b>${loc.name}</b><br>
                    ${loc.desc}<br>
                    <small>${loc.体力}</small><br><br>
                    
                    <a href="https://www.google.com/maps/search/convenience+store+near+${loc.lat},${loc.lng}" target="_blank" 
                       style="display:block; background:#27ae60; color:white; padding:8px; text-align:center; border-radius:6px; margin:4px 0; text-decoration:none;">
                       🏪 附近便利商店
                    </a>
                    <a href="https://www.google.com/maps/search/supermarket+near+${loc.lat},${loc.lng}" target="_blank" 
                       style="display:block; background:#16a085; color:white; padding:8px; text-align:center; border-radius:6px; margin:4px 0; text-decoration:none;">
                       🛒 附近超市
                    </a>
                    <a href="https://www.google.com/maps/search/restaurant+near+${loc.lat},${loc.lng}" target="_blank" 
                       style="display:block; background:#e67e22; color:white; padding:8px; text-align:center; border-radius:6px; margin:4px 0; text-decoration:none;">
                       🍜 附近餐廳
                    </a>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank" 
                       style="display:block; background:#3498db; color:white; padding:8px; text-align:center; border-radius:6px; margin:4px 0; text-decoration:none;">
                       🗺️ Google Maps 導航
                    </a>
                `;
                
                marker.bindPopup(popup);
                markers.push(marker);
            });
        }

        createMarkers(locations);

        window.filterDay = function(day) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            let filtered = (day === 'all') ? locations : locations.filter(l => l.day === day);
            createMarkers(filtered);
        };

        setTimeout(() => {
            const bounds = L.latLngBounds(locations.map(l => [l.lat, l.lng]));
            map.fitBounds(bounds, {padding: [30, 30]});
        }, 500);
    </script>
</body>
</html>
