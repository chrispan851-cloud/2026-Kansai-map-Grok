                    <div class="flex items-start justify-between">

                    </div>
                    <div class="mt-3 text-sm text-slate-600 line-clamp-2">${day.hook}</div>

                container.appendChild(card);

        }

        function showDayDetail(dayId) {
            const day = daysData.find(d => d.id === dayId);
            if (!day) return;
            currentDayFilter = dayId;

            document.getElementById('dayDetailTitle').innerHTML = `${day.emoji} ${day.num} ${day.title}`;
            document.getElementById('dayDetailSubtitle').innerHTML = day.hook;
            document.getElementById('dayOverviewText').innerHTML = `<p>${day.overview}</p>`;

            const noteDiv = document.getElementById('dayHandbookNote');
            if (day.handbookNote) {
                noteDiv.innerHTML = day.handbookNote;
                noteDiv.classList.remove('hidden');
            } else {
                noteDiv.classList.add('hidden');
            }

            // Main Places
            const mainContainer = document.getElementById('dayMainPlaces');
            mainContainer.innerHTML = '';
            day.mainPlaces.forEach(place => {
                const full = allPlaces.find(p => p.name === place.name) || {};
                const div = document.createElement('div');
                div.className = `place-row p-4 bg-white border border-slate-100 rounded-2xl flex justify-between items-start`;
                div.innerHTML = `
                    <div>
                        <div class="font-semibold">${place.name}</div>
                        <div class="text-sm text-slate-600 mt-1">${place.note}</div>
                    </div>
                    <button onclick="event.stopImmediatePropagation(); openGoogleMap('${full.url || '#'}')" class="px-3 py-1 text-xs font-bold bg-teal-700 text-white rounded-3xl">Google Maps</button>
                `;
                mainContainer.appendChild(div);
            });

            // Nearby Practical
            const nearbyContainer = document.getElementById('dayNearbyPlaces');
            nearbyContainer.innerHTML = '';
            if (day.nearby.length > 0) {
                day.nearby.forEach(place => {
                    const full = allPlaces.find(p => p.name === place.name) || {};
                    const div = document.createElement('div');
                    div.className = `place-row p-4 bg-amber-50 border border-amber-100 rounded-2xl flex justify-between items-start`;
                    div.innerHTML = `
                        <div>
                            <div class="font-semibold text-amber-800">${place.name}</div>
                            <div class="text-sm text-amber-700 mt-1">${place.note}</div>
                        </div>
                        <button onclick="event.stopImmediatePropagation(); openGoogleMap('${full.url || '#'}')" class="px-3 py-1 text-xs font-bold bg-amber-600 text-white rounded-3xl">Google Maps</button>
                    `;
                    nearbyContainer.appendChild(div);
                });
            } else {
                nearbyContainer.innerHTML = `<div class="text-sm text-slate-400 p-4">此日附近實用點位較少，可參考其他日子或手冊</div>`;
            }

            document.getElementById('dayDetailPanel').classList.remove('hidden');
            document.getElementById('dayDetailPanel').scrollIntoView({ behavior: 'smooth' });
            filterMapByDay(dayId);
        }

        function hideDayDetail() {
            document.getElementById('dayDetailPanel').classList.add('hidden');
            currentDayFilter = null;
            showAllMarkers();
        }

        function filterMapByDay(dayId) { /* same as v4 */ 
            if (!map) return;
            Object.values(allMarkers).forEach(m => map.removeLayer(m));
            allMarkers = {};
            const dayPoints = mapPoints.filter(p => p.day === dayId);
            dayPoints.forEach(point => {
                const icon = L.divIcon({ className: 'custom-marker', html: `<div style="background:${point.color};width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3)">${categoryConfig[point.category]?categoryConfig[point.category].icon:'📍'}</div>`, iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-13] });
                const marker = L.marker([point.lat, point.lng], {icon}).addTo(map);
                marker.bindPopup(`<div style="min-width:210px"><b>${point.name}</b><br><span style="font-size:13px">${point.desc}</span></div>`);
                allMarkers[point.id] = marker;
            });
            if (dayPoints.length) map.flyToBounds(L.latLngBounds(dayPoints.map(p=>[p.lat,p.lng])), {padding:[40,40], duration:1.2});
            document.getElementById('mapStatus').innerHTML = `・目前顯示：${daysData.find(d=>d.id===dayId).title}`;
        }

        function showAllMarkers() { /* same as v4 */ 
            if (!map) return;
            Object.values(allMarkers).forEach(m => map.removeLayer(m));
            allMarkers = {};
            mapPoints.forEach(point => {
                const icon = L.divIcon({ className: 'custom-marker', html: `<div style="background:${point.color};width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.25)">${categoryConfig[point.category]?categoryConfig[point.category].icon:'📍'}</div>`, iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12] });
                const marker = L.marker([point.lat, point.lng], {icon}).addTo(map);
                marker.bindPopup(`<div style="min-width:210px"><b>${point.name}</b><br><span style="font-size:13px">${point.desc}</span></div>`);
                allMarkers[point.id] = marker;
            });
            map.flyTo([34.92, 135.72], 10, { duration: 1.3 });
            document.getElementById('mapStatus').innerHTML = '';
        }

        function initializeMap() {
            map = L.map('map', { zoomControl: true, attributionControl: false }).setView([34.92, 135.72], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            showAllMarkers();
        }

        function renderFullPlacesList(filtered = null) { /* simplified version */ 
            const container = document.getElementById('fullPlacesList');
            container.innerHTML = '';
            let list = filtered || allPlaces;
            list.forEach(place => {
                const config = categoryConfig[place.cat] || { icon: "📍", bg: "bg-slate-100", text: "text-slate-600" };
                const dayInfo = daysData.find(d => d.id === place.day);
                const row = document.createElement('div');
                row.className = `flex items-center gap-x-4 px-5 py-3 border-b hover:bg-slate-50 cursor-pointer`;
                row.innerHTML = `
                    <div class="w-8 h-8 ${config.bg} rounded-2xl flex items-center justify-center text-lg">${config.icon}</div>
                    <div class="flex-1"><div class="font-medium">${place.name}</div><div class="text-xs ${config.text}">${place.cat} ${dayInfo ? '・' + dayInfo.num : ''}</div></div>
                    <button onclick="event.stopImmediatePropagation(); openGoogleMap('${place.url}')" class="px-3 py-1 text-xs font-bold border border-slate-300 rounded-3xl">Google Maps</button>
                `;
                row.onclick = () => place.day && showDayDetail(place.day);
                container.appendChild(row);
            });
        }

        function setupGlobalSearch() {
            const input = document.getElementById('globalSearch');
            input.addEventListener('input', () => {
                const term = input.value.toLowerCase().trim();
                renderFullPlacesList(term ? allPlaces.filter(p => p.name.toLowerCase().includes(term) || p.cat.toLowerCase().includes(term)) : null);
            });
        }

        function openGoogleMap(url) { if (url && url !== '#') window.open(url, '_blank'); }
        function showAllDays() { hideDayDetail(); showAllMarkers(); document.getElementById('globalSearch').value = ''; renderFullPlacesList(); }

        function initializeApp() {
            createDayCards();
            initializeMap();
            renderFullPlacesList();
            setupGlobalSearch();
        }
        window.onload = initializeApp;
    </script>
</body>
</html>
